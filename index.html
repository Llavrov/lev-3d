<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лёва на корте</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23c4562d%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2718%27 fill=%27%23d6ef3c%27/%3E%3Cpath d=%27M17 24c8 3 8 13 0 16M47 24c-8 3-8 13 0 16%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%273%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<style>
  :root { --ink: #fff; --shade: 0 1px 8px rgba(0, 0, 0, .45); --accent: #d6ef3c; }
  html, body { margin: 0; height: 100%; background: #b8d0e3; overflow: hidden; font: 500 16px/1.3 system-ui, -apple-system, sans-serif; color: var(--ink); -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #hud { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
    padding: 8px 14px; border-radius: 12px; background: rgba(16, 24, 20, .55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #hud .side { display: flex; align-items: center; gap: 8px; }
  #hud .side:first-child { justify-content: flex-end; }
  #hud b { min-width: 2.6em; text-align: center; font-size: 22px; font-weight: 700; }
  #hud small { opacity: .7; font-size: 13px; }
  #hud i { width: 7px; height: 7px; border-radius: 50%; background: transparent; }
  #hud i.on { background: var(--accent); }
  #hud .games { font-size: 13px; opacity: .8; }
  /* Выносливость: тонкая полоска под именем, видна, когда меньше ~0,9; на низкой тёплая */
  #hud .nm { display: grid; gap: 3px; }
  #hud .st { height: 2px; border-radius: 1px; background: rgba(255, 255, 255, .14); overflow: hidden; opacity: 0; transition: opacity .5s; }
  #hud .st.on { opacity: 1; }
  #hud .st span { display: block; height: 100%; background: rgba(255, 255, 255, .7); transform-origin: left; transition: background-color .6s; }
  #hud #st-o span { transform-origin: right; }
  #hud .st.low span { background: #f0a45c; }

  #msg { position: fixed; top: 34%; left: 0; right: 0; text-align: center; font-size: 30px; font-weight: 700; text-shadow: var(--shade); opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .25s; pointer-events: none; }
  #msg.show { opacity: 1; transform: none; }
  #msg.good { color: var(--accent); }
  #hint { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; text-shadow: var(--shade); pointer-events: none; }

  #start { position: fixed; inset: 0; z-index: 3; display: flex; align-items: flex-end; justify-content: center; padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(10, 14, 12, .82) 0%, rgba(10, 14, 12, .45) 34%, rgba(10, 14, 12, 0) 62%); transition: opacity .4s; }
  #start.done { opacity: 0; pointer-events: none; }
  .menu { width: 100%; max-width: 520px; display: grid; gap: 18px; justify-items: center; text-align: center; }
  .title { margin: 0; font-size: 30px; letter-spacing: -.01em; text-shadow: 0 2px 16px rgba(0, 0, 0, .45); }
  .racket[hidden] { display: none; }
  .racket { display: flex; align-items: center; gap: 14px; }
  .racket span { min-width: 150px; font-size: 18px; font-weight: 600; text-shadow: var(--shade); }
  .arr { width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .08); color: #fff; display: grid; place-items: center; cursor: pointer; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .arr:active { background: rgba(255, 255, 255, .2); }
  .arr svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .keys { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 16px; font-size: 14px; color: rgba(255, 255, 255, .88); }
  .keys span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  kbd { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 7px; font: 700 12px/1 system-ui, -apple-system, sans-serif; color: #1c211e;
    background: linear-gradient(#ffffff, #dfe3df); box-shadow: 0 2px 0 #8f9690, 0 4px 10px rgba(0, 0, 0, .35); margin-right: 2px; }
  #start .touch-only { display: none; margin: 0; color: rgba(255, 255, 255, .88); }
  button { font: inherit; }
  #play { width: 100%; max-width: 360px; min-height: 52px; border: 0; border-radius: 14px; background: var(--accent); color: #18210c; font-weight: 700; font-size: 17px; cursor: pointer; box-shadow: 0 8px 24px rgba(214, 239, 60, .28); }
  #play:disabled { opacity: .5; cursor: default; }
  #play:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  body.menu #hud, body.menu #hint { opacity: 0; }
  body.menu #pad, body.menu #joy { display: none !important; } /* кнопки ударов на телефоне — только в игре */

  #loader { position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; background: #b8d0e3; text-shadow: 0 1px 8px rgba(0, 0, 0, .25); transition: opacity .5s; }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader p { margin: 0 0 14px; font-size: 20px; }
  #loader i { display: block; height: 2px; background: rgba(255, 255, 255, .35); }
  #loader b { display: block; width: 0; height: 100%; background: #fff; transition: width .2s; }

  #pad { display: none; position: fixed; right: calc(12px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); gap: 10px; grid-template-columns: 64px 64px; justify-items: center; }
  #pad button { min-width: 64px; min-height: 64px; border-radius: 50%; border: 0; background: rgba(16, 24, 20, .55); color: #fff; font-size: 14px; font-weight: 700; touch-action: none; }
  #pad #btop, #pad #bcut, #pad #bdrop { min-width: 64px; min-height: 44px; border-radius: 22px; font-size: 13px; }
  #pad #btop.on, #pad #bcut.on { background: var(--accent); color: #18210c; }
  #pad #bdrop { grid-column: span 2; width: 100%; }
  #joy { position: fixed; left: 0; top: 0; width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .5); opacity: 0; pointer-events: none; transition: opacity .15s; }
  #joy.on { opacity: 1; }
  #knob { position: absolute; left: 36px; top: 36px; width: 48px; height: 48px; border-radius: 50%; background: rgba(255, 255, 255, .7); }
  @media (pointer: coarse) {
    #pad { display: grid; }
    #start .touch-only { display: block; }
    #start .keys-only { display: none; }
    #hint { bottom: calc(232px + env(safe-area-inset-bottom)); } /* выше кнопок ударов */
  }
</style>
</head>
<body class="menu">
<canvas id="c"></canvas>

<div id="hud" aria-live="polite">
  <div class="side"><span class="nm"><small>Лёва</small><span class="st" id="st-l"><span></span></span></span><i id="srv-l"></i><b id="pl">0</b></div>
  <span class="games"><span id="gl">0</span>&nbsp;:&nbsp;<span id="go">0</span></span>
  <div class="side"><b id="po">0</b><i id="srv-o"></i><span class="nm"><small>Соперник</small><span class="st" id="st-o"><span></span></span></span></div>
</div>
<div id="msg"></div>
<div id="hint"></div>

<div id="pad">
  <button id="btop" aria-pressed="false">Кручёный</button>
  <button id="bcut" aria-pressed="false">Резаный</button>
  <button id="bdrop">Укороч.</button>
  <button id="bbh">Бэкхенд</button>
  <button id="bfh">Форхенд</button>
</div>
<div id="joy"><div id="knob"></div></div>

<div id="start">
  <div class="menu">
    <p class="title"><b>Лёва на&nbsp;корте</b></p>
    <div class="racket" id="rk" hidden>
      <button class="arr" id="rkPrev" aria-label="Предыдущая ракетка"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span id="rkName">Красная</span>
      <button class="arr" id="rkNext" aria-label="Следующая ракетка"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="keys keys-only">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> бег и&nbsp;куда полетит мяч</span>
      <span><kbd>K</kbd> форхенд</span>
      <span><kbd>J</kbd> бэкхенд</span>
      <span><kbd>L</kbd> укороченный</span>
      <span><kbd>Shift</kbd> кручёный</span>
      <span><kbd>Alt</kbd> резаный</span>
      <span><kbd>Пробел</kbd> подача</span>
    </div>
    <p class="touch-only">Слева ведёшь пальцем&nbsp;— бег, справа&nbsp;— удары</p>
    <button id="play" disabled>Играть</button>
  </div>
</div>
<div id="loader"><div><p>Лёва выходит на&nbsp;корт</p><i><b></b></i></div></div>
<script>
  // Игра целиком на 3D. Без WebGL2 (старая видеокарта, удалённый стол) или в старом Safari (ниже 16.4 модуль не разбирается)
  // страница висела бы на заставке: вместо этого честно говорим, что нужно.
  window.__ready = false; // карточка сайта в Telegram ждёт true, чтобы снять игру, а не заставку загрузки
  (function () {
    var fail = function () {
      if (window.__ready) return;
      var p = document.querySelector('#loader p'), i = document.querySelector('#loader i');
      p.innerHTML = 'Игра не&nbsp;запустилась в&nbsp;этом браузере.<br>Открой в&nbsp;свежем Chrome, Safari или Firefox с&nbsp;включённой 3D-графикой.';
      p.style.maxWidth = '22em'; p.style.textAlign = 'center'; if (i) i.style.display = 'none';
    };
    var c = document.createElement('canvas');
    if (!c.getContext('webgl2')) return fail();
    addEventListener('error', function () { setTimeout(fail, 3000); });
    setTimeout(fail, 45000);
  })();
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
