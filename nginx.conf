server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json application/octet-stream model/gltf-binary; # модели glb тоже жмём
  add_header X-Robots-Tag "noindex, nofollow" always; # временный адрес: поисковикам закрыто
  # у файлов сборки в имени отпечаток содержимого: их можно держать в кеше вечно
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Robots-Tag "noindex, nofollow" always; }
  # модели и текстуры лежат под постоянными именами: кеш на час, чтобы правки доезжали
  location / { add_header Cache-Control "public, max-age=3600"; add_header X-Robots-Tag "noindex, nofollow" always; try_files $uri $uri/ =404; }
  location = /index.html { add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow" always; }
  location = /trainer.html { add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow" always; }
}
